name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies and Accept Licenses
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev aidl
        pip install --upgrade buildozer cython

    - name: Build with buildozer
      run: |
        buildozer -v android debug -- --android.accept_sdk_license=True

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
